<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex-Box</title>
    <style>
        .conteiner {
            background-color: lightcoral;
            display: flex;
            flex-flow: row nowrap;
            
        }

        .item {
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 190px;
            padding: 20px;

        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">menor</div>
        <div class="item">um pouco maior</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">Maior que o maior que o menor</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
</body>
</html>
