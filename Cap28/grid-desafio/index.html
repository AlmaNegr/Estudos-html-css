<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio-Grid</title>
    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(3, auto);
            grid-template-rows: repeat(4, 100px);
            gap: 10px;
        }

       .item1 {
            background-color: red;
            color: white;
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 4;
       }

       .item2 {
            background-color: blue;
            grid-row: 2 / 3;
            grid-column: 1 / 4;
       }

       .item3 {
            background-color: green;
            grid-area: 3 / 1 / 4 / 3;
       }

       .item4 {
            background-color: pink;
            grid-area: 3 / 3 / 4 / 4;
       }

       .item5 {
        background-color: yellow;
        grid-area: 4 / 1 / 5 / span 3;
       }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">Topo</div>
        <div class="item2">Menu</div>
        <div class="item3">Principal</div>
        <div class="item4">Secundário</div>
        <div class="item5">Rodapé</div>
    </div>
</body>
</html>
