<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisando</title>
    <style>
        .container {
            display: grid;
            gap: 10px;
            grid-template: repeat(3, 100px) / repeat(4, 1fr);
        }

        .item1 {
            background-color: red;
            color: white;
            grid-row: 1 / span 1;
            grid-column: 1 / span 4;
        }

        .item2 {
            background-color: green;
            grid-row: span 2;
            grid-column: span 2;
           
        }

        .item3 {
            background-color: yellow;
            grid-row: span 2;
            grid-column: span 2;
            
        }
    </style>
</head>
<body>
     <div class="container">
        <div class="item1">Item 01</div>
        <div class="item2">B</div>
        <div class="item3">C</div>
        
    </div>
</body>
</html>
