<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes</title>
    <style>
        body {
            background-color: darkgreen;
            font-family: Arial, Helvetica, sans-serif;
        }

        iframe {
            margin-top: 20px;
            height: 300px;
            width: 95vw;
            border: 2px dashed orange;
        }

        ul {
            padding: 10px;
            margin-bottom: 20px;
        }
        h1 {
            background-color: white;
            padding: 20px;
            margin: -10px;
            margin-bottom: 10px;
        }

        h2 {
            background-color: white;
            padding: 20px;
            margin: -10px;
        }
    </style>
</head>
<body>
    <h1>Abrindo páginas com o iframe</h1>
    <ul>
        <li><a href="iframe001.html" target="frame">Primeira página</a></li>
        <li><a href="#">Segunda página</a></li>
        <li><a href="#">Terceira página</a></li>
    </ul>
    <h2>Páginas que serão abertas</h2>

    <iframe name="frame"></iframe>
</body>
</html>
