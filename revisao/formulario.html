<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <header>
        <h1>Formulário</h1>
        <p>Testando as funcionalidades dos formulários</p>
    </header>
    <main>
        <section>
            <form action="cadastro.php" method="POST" autocomplete="on">
                <p>
                    <label for="iusu">Usuário:</label>
                    <input type="text" name="usu" id="iusu" required minlength="5" maxlength="8" size="10" autocomplete="username" placeholder="Nome do usuário">
                </p>
                <p>
                    <label for="isenha">Senha:</label>
                    <input type="password" name="senha" id="isenha" required minlength="5" size="10" autocomplete="current-password" placeholder="Digite sua senha">
                </p>
                <p>
                    <input type="submit" value="Enviar">
                    <input type="reset" value="Limpar">
                </p>
            </form>
        </section>
    </main>
</body>
</html>
