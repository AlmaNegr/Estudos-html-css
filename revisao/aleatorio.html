<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <header>
        <h1>Formulário</h1>
        <p>informações sobre mim</p>
    </header>
    <main>
        <section>
            <div id="img">
                
            </div>
            <div id="formulario">
                <p class="campo">
                    <label for="inome">Nome</label>
                    <input type="text" name="nome" id="inome" maxlength="40" placeholder="nome completo"  required>
                </p>
                <p class="campo">
                    <label for="iemail">E-mail</label>
                    <input type="email" name="email" id="iemail" required placeholder="seu @email">
                </p>
            </div>
        </section>
    </main>
</body>
</html>
